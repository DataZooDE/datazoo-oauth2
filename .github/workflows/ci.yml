# CI for datazoo-oauth2.
#
# This library is consumed as a commit-pinned submodule by TWO shipping
# DuckDB extensions (erpl-web and duckdb-gdrive). A bad commit here is
# therefore discoverable only downstream unless something builds it on its
# own, which is what this workflow is for -- it exists before either consumer
# pins the library, deliberately.
#
# Standalone mode builds ONLY the pure-logic sources: DuckDB is not available
# here, so the full `datazoo_oauth2` target (which needs duckdb.hpp and
# DuckDB's vendored httplib) is built by the consumers, not here. See the
# header comment in CMakeLists.txt for the two-mode split.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both consumers ship on all three; the loopback OAuth2 server and the
        # browser launcher are the most platform-sensitive code in the
        # library, so a Linux-only matrix would miss exactly the things most
        # likely to break.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 542289e02dec80d057e30f3d7a101c374a94d804

      # x64-windows-static, not the x64-windows default. CMakeLists.txt forces
      # MSVC_RUNTIME_LIBRARY=MultiThreaded (/MT) on the test binary because
      # that is what the DuckDB extensions consuming this library build with.
      # Against the default DLL triplet those deps are /MD and the link fails
      # with LNK2038. Pinning the triplet here keeps the standalone build
      # consistent with how the library is actually consumed, rather than
      # making the /MT choice a lie on one platform.
      - name: Select static triplet on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "VCPKG_TARGET_TRIPLET=x64-windows-static" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          ${{ runner.os == 'Windows' && '-DVCPKG_TARGET_TRIPLET=x64-windows-static' || '' }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      # ctest runs the Catch2 suite AND check_no_vendor_names (REQ-A-03),
      # which is registered as a test rather than a separate job so it cannot
      # be skipped independently of the suite it guards.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # CMakeLists.txt does find_package(Catch2 3 CONFIG QUIET) and simply
      # does not register the unit tests when Catch2 is absent -- so a broken
      # dependency install produces an EMPTY, PASSING ctest run. That is a
      # false green of exactly the kind this workflow exists to prevent, so
      # assert the suite is actually there.
      - name: Guard against a silently empty test suite
        shell: bash
        run: |
          count=$(ctest --test-dir build --build-config Release -N \
                  | sed -n 's/^Total Tests: //p')
          echo "registered tests: ${count:-0}"
          if [[ "${count:-0}" -lt 10 ]]; then
            echo "::error::Expected the Catch2 suite to be registered, found ${count:-0} tests." \
                 "Catch2 probably failed to resolve, and ctest passed vacuously."
            exit 1
          fi
